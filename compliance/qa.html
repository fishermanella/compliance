<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI Compliance Radar — 法规问答" />
  <title>法规问答 · AI Compliance Radar</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    /* ===== Legal Q&A page ===== */
    .page-head {
      text-align: center;
      margin-bottom: var(--sp-6);
    }

    .page-head .page-title {
      font-size: 28px;
      line-height: 36px;
      font-weight: 600;
    }

    .page-head .page-sub {
      margin-top: var(--sp-2);
      font-size: 14px;
      color: var(--text-secondary);
    }

    .qa-search {
      max-width: 760px;
      margin: 0 auto;
    }

    .qa-search .search-box {
      box-shadow: var(--shadow-light);
    }

    /* Suggested questions */
    .suggest {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--sp-2);
      margin-top: var(--sp-4);
    }

    .suggest .tag {
      height: 30px;
      padding: 0 14px;
      font-size: 13px;
    }

    /* Answer */
    .answer {
      max-width: 860px;
      margin: var(--sp-8) auto 0;
    }

    .answer-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--sp-2);
      margin-bottom: var(--sp-5);
    }

    .answer-head .caption {
      margin-left: auto;
    }

    .answer-section {
      padding: var(--sp-5) 0;
      border-top: 1px solid var(--border);
    }

    .answer-section:first-of-type {
      border-top: none;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: var(--sp-3);
    }

    .section-label::before {
      content: "";
      width: 16px;
      height: 2px;
      border-radius: 1px;
      background: var(--navy);
    }

    .conclusion {
      font-size: 17px;
      line-height: 28px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .analysis {
      font-size: 14px;
      line-height: 24px;
      color: var(--text-primary);
    }

    /* Evidence cards */
    .evidence-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--sp-3);
    }

    .evidence-card {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-4);
      padding: var(--sp-4) var(--sp-5);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    .evidence-card .ev-badge {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: var(--navy-soft);
      color: var(--navy);
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 700;
    }

    .evidence-card .ev-badge.ev-a { background: var(--low-bg); color: var(--low); }
    .evidence-card .ev-badge.ev-b { background: var(--info-bg); color: var(--info); }
    .evidence-card .ev-badge.ev-c { background: var(--medium-bg); color: var(--medium); }

    .evidence-card .ev-body {
      flex: 1;
      min-width: 0;
    }

    .evidence-card .ev-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .evidence-card .ev-desc {
      margin-top: 3px;
      font-size: 13px;
      line-height: 20px;
      color: var(--text-secondary);
    }

    .evidence-card .ev-source {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: var(--sp-2);
      font-size: 13px;
      font-weight: 500;
      color: var(--navy);
    }

    .evidence-card .ev-source svg {
      width: 14px;
      height: 14px;
    }

    /* Condition list */
    .cond-list {
      display: grid;
      gap: var(--sp-2);
    }

    .cond-item {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-2);
      font-size: 14px;
      line-height: 22px;
      color: var(--text-primary);
    }

    .cond-item svg {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      color: var(--text-tertiary);
      margin-top: 3px;
    }

    /* Sources */
    .source-list {
      display: grid;
      gap: var(--sp-2);
    }

    .source-item {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: 10px var(--sp-3);
      border-radius: var(--radius-sm);
      transition: background var(--speed-fast) var(--ease);
    }

    .source-item:hover {
      background: var(--hover);
    }

    .source-item .src-grade {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--navy-soft);
      color: var(--navy);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
    }

    .source-item .src-grade.g-a { background: var(--low-bg); color: var(--low); }
    .source-item .src-grade.g-b { background: var(--info-bg); color: var(--info); }
    .source-item .src-grade.g-c { background: var(--medium-bg); color: var(--medium); }

    .source-item .src-text {
      flex: 1;
      font-size: 14px;
      color: var(--text-primary);
    }

    .source-item .src-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--navy);
      white-space: nowrap;
    }

    /* Disclaimer */
    .answer-disclaimer {
      margin-top: var(--sp-5);
      padding: var(--sp-4) var(--sp-5);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 12px;
      line-height: 18px;
      color: var(--text-tertiary);
    }

    /* Loading */
    .loading {
      max-width: 860px;
      margin: var(--sp-8) auto 0;
      padding: var(--sp-8);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .loading .loading-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: var(--sp-4);
    }

    .loading-steps {
      display: grid;
      gap: var(--sp-2);
    }

    .loading-step {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      font-size: 14px;
      color: var(--text-tertiary);
    }

    .loading-step.done {
      color: var(--text-primary);
    }

    .loading-step.active {
      color: var(--navy);
    }

    .loading-step .step-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .loading-step.done .step-icon {
      color: var(--success);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--navy-soft);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty / insufficient */
    .insufficient {
      max-width: 860px;
      margin: var(--sp-8) auto 0;
      padding: var(--sp-8);
      text-align: center;
    }

    .insufficient .ins-icon {
      width: 36px;
      height: 36px;
      margin: 0 auto var(--sp-3);
      color: var(--text-tertiary);
    }

    .insufficient h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .insufficient p {
      margin-top: var(--sp-2);
      font-size: 14px;
      color: var(--text-secondary);
    }

    @media (max-width: 767px) {
      .page-head .page-title {
        font-size: 24px;
        line-height: 32px;
      }

      .conclusion {
        font-size: 16px;
        line-height: 26px;
      }

      .evidence-card {
        flex-direction: column;
        gap: var(--sp-3);
      }

      .answer-head .caption {
        margin-left: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header class="header">

  <!-- Main -->
  <main class="main">
    <div class="container">
      <div class="page-head">
        <h1 class="page-title">法规问答</h1>
        <p class="page-sub">Legal Q&amp;A · 用自然语言提问，输出「结论 + 法律依据 + 分析 + 来源」</p>
      </div>

      <!-- Search -->
      <form class="qa-search" data-qa-form>
        <div class="search-box search-lg">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input
            type="search"
            name="q"

          />
          <button class="btn btn-primary search-action" type="submit">开始检索</button>

      <!-- Suggested questions -->
      <div class="suggest" data-suggest>

        <button class="tag" type="button" data-q="美国 California 对儿童数据有什么要求？">美国加州 · 儿童数据</button>
        <button class="tag" type="button" data-q="GDPR 下使用用户行为数据训练 AI 模型需要什么法律基础？">GDPR · 训练 AI 模型</button>

  <footer class="main" style="padding-top: 0; padding-bottom: var(--sp-8);">
    <div class="container">
      <div class="divider"></div>
      <p class="caption text-tertiary">
        法规问答输出为初步法律研究结论，不构成正式法律意见。关键结论均标注证据等级并尽可能追溯至官方来源。
      </p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script>
    (function () {
      'use strict';

      var LOADING_STEPS = [
        '识别法域与法律问题',
        '检索法律来源',
        '定位具体条文',
        '核验现行有效性',
        '形成结论并附来源'
      ];

      /* ---- Demo knowledge base ---- */
      var QA = [
        {
          match: /日本|appi|第三方提供|line/i,
          jurisdiction: 'JP',
          jurisdictionLabel: '日本',
          grade: 'A',
          asOf: '2026-09-18',
          conclusion: '根据日本《个人信息保护法》（APPI），个人信息处理者向第三方提供个人信息，原则上须事先取得本人同意；仅在满足法定「第三方提供例外（opt-out）」条件时，方可在未取得逐项同意的情况下提供。',
          provisions: [
            {
              name: 'APPI 第 27 条第 1 款',
              desc: '处理者除本条第 2 款规定的情形外，未经本人事先同意，不得向第三方提供个人信息。',
              source: '个人信息保护委员会（PPC）',
              grade: 'A',
              url: 'https://www.ppc.go.jp/'
            },
            {
              name: 'APPI 第 27 条第 2 款（opt-out）',
              desc: '事先就向第三方提供的事项通知本人或置于本人容易知悉的状态，并向 PPC 申报后，可提供部分个人信息，但敏感信息等除外。',
              source: '个人信息保护委员会（PPC）',
              grade: 'A',
              url: 'https://www.ppc.go.jp/'
            }
          ],
          analysis: 'APPI 将「向第三方提供」作为独立于「利用目的」的规制行为：即使收集合法、利用目的合规，向第三方提供仍须单独取得同意或满足法定例外。营销场景下通过 LINE 等渠道向广告平台、第三方服务商传输用户数据，通常构成「向第三方提供」。',
          conditions: [
            'opt-out 制度不适用于：敏感个人信息、以不正当手段取得的个人信息、以及从其他处理者处受让的个人信息——此类情形仍需逐项取得本人同意。',
            '「委托处理」（第 27 条第 5 款第 1 项）不属于「向第三方提供」，无需单独同意，但应签署委托合同并履行监督义务。',
            '若为「共同利用」（特定共同利用目的、明确责任主体并通知/公布），亦不构成「向第三方提供」。'
          ],
          cases: 'PPC 执法实践中，企业未取得同意即通过广告 SDK 向第三方提供用户数据，被要求整改并完善同意取得流程。',
          sources: [
            { label: 'APPI 条文（PPC 官方）', grade: 'A', url: 'https://www.ppc.go.jp/' },
            { label: 'PPC 关于第三方提供的指南', grade: 'B', url: 'https://www.ppc.go.jp/' }
          ]
        },
        {
          match: /加州|california|儿童|未成年|coppa|ccpa/i,
          jurisdiction: 'US-CA',
          jurisdictionLabel: '美国加州',
          grade: 'A',
          asOf: '2026-09-18',
          conclusion: '加州对儿童数据的规制主要来自 CCPA/CPRA（16 岁以下消费者数据的销售与共享须取得 opt-in 同意）与联邦 COPPA（面向 13 岁以下儿童的在线服务收集个人信息须取得可验证的家长同意）。',
          provisions: [
            {
              name: 'CCPA/CPRA § 1798.120',
              desc: '企业明知消费者为 13 至 16 岁时，不得销售或共享其个人信息，除非取得本人（或 13 岁以下儿童的家长）的明确授权。',
              source: '加州总检察长办公室（OAG）',
              grade: 'A',
              url: 'https://oag.ca.gov/privacy/ccpa'
            },
            {
              name: 'COPPA（联邦）',
              desc: '面向 13 岁以下儿童的在线服务，收集、使用或披露儿童个人信息前须取得可验证的家长同意。',
              source: '联邦贸易委员会（FTC）',
              grade: 'A',
              url: 'https://www.ftc.gov/legal-library/browse/rules/childrens-online-privacy-protection-rule-coppa'
            }
          ],
          analysis: '判断适用哪套规则的关键在于用户年龄与业务性质：若产品面向 13 岁以下儿童，COPPA 优先适用；若处理 13 至 16 岁用户数据且涉及销售/共享，则触发 CCPA 的 opt-in 同意要求。面向未成年人的 AI 陪伴类产品还涉及画像与自动化决策的额外限制。',
          conditions: [
            '13 岁以下：COPPA 要求「可验证的家长同意」（VPC），且仅可收集为实现功能所必需的最少信息。',
            '13 至 16 岁：销售或共享数据须本人 opt-in 同意，默认不得销售/共享。',
            '「明知」要素：若企业不知道用户年龄，可能影响义务触发，但面向儿童的定位或用户画像会使「明知」更易成立。'
          ],
          cases: 'FTC 已就未取得家长同意即收集儿童信息、以及在儿童向产品中嵌入追踪/广告 SDK 的行为采取多次执法行动。',
          sources: [
            { label: 'CCPA/CPRA 条款（OAG 官方）', grade: 'A', url: 'https://oag.ca.gov/privacy/ccpa' },
            { label: 'COPPA 规则（FTC 官方）', grade: 'A', url: 'https://www.ftc.gov/legal-library/browse/rules/childrens-online-privacy-protection-rule-coppa' }
          ]
        },
        {
          match: /gdpr|欧盟|训练|模型|行为数据|ai ?模型/i,
          jurisdiction: 'EU',
          jurisdictionLabel: '欧盟',
          grade: 'A',
          asOf: '2026-09-18',
          conclusion: '使用用户行为数据训练 AI 模型，须具备 GDPR 第 6 条的合法性基础（如同意、合同履行、合法利益等），并受第 5 条「目的限定」约束——若训练用途与原始收集目的不兼容，则不能直接沿用原合法性基础；涉及对个人产生法律或类似重大影响的自动化决策时，另须满足第 22 条。',
          provisions: [
            {
              name: 'GDPR 第 6 条',
              desc: '处理个人数据须至少满足一项合法性基础：同意、合同履行、法定义务、重大利益、公共利益、合法利益。',
              source: 'EUR-Lex',
              grade: 'A',
              url: 'https://eur-lex.europa.eu/'
            },
            {
              name: 'GDPR 第 5 条第 1 款（b）项（目的限定）',
              desc: '个人数据须为特定、明确、合法目的而收集，不得以与这些目的不兼容的方式进一步处理。',
              source: 'EUR-Lex',
              grade: 'A',
              url: 'https://eur-lex.europa.eu/'
            },
            {
              name: 'GDPR 第 22 条（自动化决策）',
              desc: '数据主体有权不受仅基于自动化处理、且对其产生法律效力或类似重大影响的决定的约束。',
              source: 'EUR-Lex',
              grade: 'A',
              url: 'https://eur-lex.europa.eu/'
            }
          ],
          analysis: '关键问题在于「目的兼容性」：若原始隐私告知未向用户说明数据将用于模型训练，则难以直接依赖原合法性基础，通常需重新取得同意或重新评估合法利益。依赖「合法利益」须通过利益平衡测试，并考虑用户合理预期、数据敏感度与可识别性。',
          conditions: [
            '若已就「模型训练」取得清晰、单独的同意，则可用作合法性基础，但用户有权随时撤回。',
            '依赖「合法利益」须完成利益平衡评估（LIA）并留存记录，且需向用户提供反对权。',
            '经匿名化后不再属于个人数据的数据，不受 GDPR 约束，但须谨慎判断是否真正达到匿名化标准。',
            '若模型可能对个人产生法律或类似重大影响（如信贷、雇佣、医疗决策），需额外满足第 22 条及第 35 条 DPIA 要求。'
          ],
          cases: 'EDPB 与各国监管机构（DPA）已多次就 AI 模型训练的目的限定与合法利益问题发布指引，强调不得以「技术创新」为由绕过目的限定原则。',
          sources: [
            { label: 'GDPR 条文（EUR-Lex 官方）', grade: 'A', url: 'https://eur-lex.europa.eu/' },
            { label: 'EDPB 关于 AI 模型处理的意见', grade: 'B', url: 'https://www.edpb.europa.eu/' }
          ]
        }
      ];

      var resultEl = document.querySelector('[data-result]');
      var form = document.querySelector('[data-qa-form]');
      var input = document.querySelector('[data-qa-input]');
      var suggestEl = document.querySelector('[data-suggest]');
      var currentTimer = null;

      function findAnswer(query) {
        for (var i = 0; i < QA.length; i++) {
          if (QA[i].match.test(query)) return QA[i];
        }
        return null;
      }

      function evidenceCard(p) {
        var badgeClass = p.grade === 'A' ? 'ev-a' : p.grade === 'B' ? 'ev-b' : 'ev-c';
        return '' +
          '<div class="evidence-card">' +
            '<span class="ev-badge ' + badgeClass + '">' + p.grade + '</span>' +
            '<div class="ev-body">' +
              '<div class="ev-name">' + p.name + '</div>' +
              '<p class="ev-desc">' + p.desc + '</p>' +
              '<span class="caption" style="margin-top:6px;display:inline-block;">' + p.source + '</span>' +
              '<a class="ev-source" href="' + p.url + '" target="_blank" rel="noopener">' +
                'View source' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>' +
              '</a>' +
            '</div>' +
          '</div>';
      }

      function condItem(text) {
        return '' +
          '<div class="cond-item">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></svg>' +
            '<span>' + text + '</span>' +
          '</div>';
      }

      function sourceItem(s) {
        var g = s.grade === 'A' ? 'g-a' : s.grade === 'B' ? 'g-b' : 'g-c';
        return '' +
          '<div class="source-item">' +
            '<span class="src-grade ' + g + '">' + s.grade + '</span>' +
            '<span class="src-text">' + s.label + '</span>' +
            '<a class="src-link" href="' + s.url + '" target="_blank" rel="noopener">查看原文 →</a>' +
          '</div>';
      }

      function renderAnswer(a) {
        var gradeBadge = a.grade === 'A' ? 'risk-low' : a.grade === 'B' ? 'risk-medium' : 'risk-high';

        var html = '' +
          '<div class="answer">' +
            '<div class="answer-head">' +
              '<span class="juris">' + a.jurisdiction + '</span>' +
              '<span class="tag">' + a.jurisdictionLabel + '</span>' +
              '<span class="risk ' + gradeBadge + '">证据等级 ' + a.grade + '</span>' +
              '<span class="caption">截至 ' + a.asOf + '</span>' +
            '</div>' +

            '<div class="answer-section">' +
              '<div class="section-label">结论</div>' +
              '<p class="conclusion">' + a.conclusion + '</p>' +
            '</div>' +

            '<div class="answer-section">' +
              '<div class="section-label">法律依据</div>' +
              '<div class="evidence-list">' +
                a.provisions.map(evidenceCard).join('') +
              '</div>' +
            '</div>' +

            '<div class="answer-section">' +
              '<div class="section-label">法律分析</div>' +
              '<p class="analysis">' + a.analysis + '</p>' +
            '</div>' +

            '<div class="answer-section">' +
              '<div class="section-label">适用条件 / 例外</div>' +
              '<div class="cond-list">' +
                a.conditions.map(condItem).join('') +
              '</div>' +
            '</div>' +

            '<div class="answer-section">' +
              '<div class="section-label">案例 / 监管实践</div>' +
              '<p class="analysis">' + a.cases + '</p>' +
            '</div>' +

            '<div class="answer-section">' +
              '<div class="section-label">来源</div>' +
              '<div class="source-list">' +
                a.sources.map(sourceItem).join('') +
              '</div>' +
            '</div>' +

            '<div class="answer-disclaimer">' +
              '本回答为初步法律研究结论，基于截至 ' + a.asOf + ' 可获得的公开资料生成，不构成正式法律意见。关键结论请以官方原文为准。' +
            '</div>' +
          '</div>';

        resultEl.innerHTML = html;
      }

      function renderInsufficient(query) {
        var html = '' +
          '<div class="insufficient">' +
            '<svg class="ins-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M12 9v4M12 17h.01" />' +
              '<path d="m10.3 3.9 1.7 3 1.7-3a10 10 0 0 0-3.4 0Z" />' +
              '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z" />' +
            '</svg>' +
            '<h3>当前材料不足，无法形成确定性结论</h3>' +
            '<p>为提供准确回答，仍需要进一步确认：涉及的法域、业务/产品类型、所处理的数据类型，以及是否有官方原文可核验。</p>' +
          '</div>';
        resultEl.innerHTML = html;
      }

      function renderLoading() {
        var steps = LOADING_STEPS.map(function (s, i) {
          var cls = i === 0 ? 'active' : '';
          var icon = i === 0
            ? '<span class="spinner step-icon"></span>'
            : '<svg class="step-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>';
          return '<div class="loading-step ' + cls + '">' + icon + '<span>' + s + '</span></div>';
        }).join('');

        resultEl.innerHTML = '' +
          '<div class="loading">' +
            '<div class="loading-title">正在检索法律依据……</div>' +
            '<div class="loading-steps">' + steps + '</div>' +
          '</div>';
      }

      function submit(query) {
        query = (query || '').trim();
        if (!query) return;

        input.value = query;
        renderLoading();

        if (currentTimer) clearTimeout(currentTimer);
        currentTimer = setTimeout(function () {
          var answer = findAnswer(query);
          if (answer) {
            renderAnswer(answer);
          } else {
            renderInsufficient(query);
          }
        }, 1100);
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        submit(input.value);
      });

      suggestEl.querySelectorAll('.tag').forEach(function (chip) {
        chip.addEventListener('click', function () {
          submit(chip.getAttribute('data-q'));
        });
      });

      /* Preload demo answer */
      submit('日本向第三方提供个人信息需要满足哪些条件？');
    })();
  </script>
</body>
</html>
