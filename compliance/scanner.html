<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI Compliance Radar — 业务风险扫描" />
  <title>风险扫描 · AI Compliance Radar</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    /* ===== Risk Scanner page ===== */
    .page-head {
      text-align: center;
      margin-bottom: var(--sp-6);
    }

    .page-head .page-title {
      font-size: 28px;
      line-height: 36px;
      font-weight: 600;
    }

    .page-head .page-sub {
      margin-top: var(--sp-2);
      font-size: 14px;
      color: var(--text-secondary);
    }

    .scan-form {
      max-width: 780px;
      margin: 0 auto;
    }

    .scan-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--sp-5);
      transition: border-color var(--speed-fast) var(--ease);
      box-shadow: var(--shadow-light);
    }

    .scan-box:focus-within {
      border-color: var(--navy);
    }

    .scan-box textarea {
      width: 100%;
      min-height: 120px;
      border: none;
      outline: none;
      resize: vertical;
      font-size: 15px;
      line-height: 24px;
      color: var(--text-primary);
      background: transparent;
    }

    .scan-box textarea::placeholder {
      color: var(--text-tertiary);
    }

    .scan-box .scan-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
      margin-top: var(--sp-3);
      padding-top: var(--sp-3);
      border-top: 1px solid var(--border);
    }

    .scan-box .scan-hint {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .suggest {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--sp-2);
      margin-top: var(--sp-4);
    }

    .suggest .tag {
      height: 30px;
      padding: 0 14px;
      font-size: 13px;
      text-align: left;
    }

    /* ---- Result ---- */
    .result {
      max-width: 900px;
      margin: var(--sp-8) auto 0;
    }

    /* Overview */
    .overview {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--sp-4);
      margin-bottom: var(--sp-6);
    }

    .ov-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--sp-5);
    }

    .ov-item .ov-value {
      font-size: 30px;
      line-height: 36px;
      font-weight: 600;
      color: var(--navy);
    }

    .ov-item .ov-label {
      margin-top: var(--sp-1);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .ov-item.ov-high .ov-value { color: var(--high); }
    .ov-item.ov-medium .ov-value { color: var(--medium); }
    .ov-item.ov-low .ov-value { color: var(--low); }

    /* Identification */
    .identify {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--sp-6);
      margin-bottom: var(--sp-6);
    }

    .identify .id-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: var(--sp-4);
    }

    .id-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--sp-5);
    }

    .id-field .id-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: var(--sp-2);
    }

    .id-field .id-value {
      font-size: 14px;
      line-height: 22px;
      color: var(--text-primary);
    }

    .id-field .id-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Risk cards */
    .risk-list-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: var(--sp-3);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    .risk-list-title .count {
      color: var(--text-tertiary);
      font-weight: 400;
    }

    .risk-list {
      display: grid;
      gap: var(--sp-3);
    }

    .risk-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: border-color var(--speed-fast) var(--ease);
    }

    .risk-card:hover {
      border-color: var(--border-strong);
    }

    .risk-card-head {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-4);
      width: 100%;
      padding: var(--sp-4) var(--sp-5);
      text-align: left;
    }

    .risk-card-head:hover {
      background: var(--bg);
    }

    .risk-card-head .rc-main {
      flex: 1;
      min-width: 0;
    }

    .risk-card-head .rc-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 22px;
      color: var(--text-primary);
    }

    .risk-card-head .rc-summary {
      margin-top: 2px;
      font-size: 13px;
      line-height: 20px;
      color: var(--text-secondary);
    }

    .risk-card-head .rc-chevron {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      color: var(--text-tertiary);
      margin-top: 2px;
      transition: transform var(--speed-fast) var(--ease);
    }

    .risk-card.is-open .rc-chevron {
      transform: rotate(180deg);
    }

    .risk-card-body {
      display: none;
      padding: 0 var(--sp-5) var(--sp-5);
      border-top: 1px solid var(--border);
    }

    .risk-card.is-open .risk-card-body {
      display: block;
    }

    .rc-detail {
      padding-top: var(--sp-4);
    }

    .rc-detail .rc-dlabel {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: var(--sp-1);
    }

    .rc-detail .rc-dtext {
      font-size: 14px;
      line-height: 22px;
      color: var(--text-primary);
      margin-bottom: var(--sp-3);
    }

    .rc-detail .rc-dtext:last-child {
      margin-bottom: 0;
    }

    .rc-detail .legal-basis {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      background: var(--navy-soft);
      color: var(--navy);
      font-size: 13px;
      font-weight: 500;
    }

    /* Loading */
    .loading {
      max-width: 900px;
      margin: var(--sp-8) auto 0;
      padding: var(--sp-8);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .loading .loading-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: var(--sp-4);
    }

    .loading-steps {
      display: grid;
      gap: var(--sp-2);
    }

    .loading-step {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      font-size: 14px;
      color: var(--text-tertiary);
    }

    .loading-step.done { color: var(--text-primary); }
    .loading-step.active { color: var(--navy); }

    .loading-step .step-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .loading-step.done .step-icon { color: var(--success); }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--navy-soft);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty */
    .empty {
      max-width: 780px;
      margin: var(--sp-8) auto 0;
      padding: var(--sp-10) var(--sp-6);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .empty .empty-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto var(--sp-3);
      color: var(--text-tertiary);
    }

    .empty h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .empty p {
      margin-top: var(--sp-2);
      font-size: 14px;
      color: var(--text-secondary);
    }

    .empty .try {
      margin-top: var(--sp-3);
      font-size: 13px;
      color: var(--navy);
    }

    @media (max-width: 767px) {
      .page-head .page-title {
        font-size: 24px;
        line-height: 32px;
      }

      .overview {
        grid-template-columns: repeat(2, 1fr);
        gap: var(--sp-3);
      }

      .id-grid {
        grid-template-columns: 1fr;
      }

      .scan-box .scan-foot {
        flex-direction: column;
        align-items: stretch;
      }

      .scan-box .scan-foot .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9" />
            <circle cx="12" cy="12" r="5" />
            <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <span>AI Compliance Radar</span>
      </a>

      <nav class="nav" aria-label="主导航">
        <a class="nav-link" data-nav-page="monitor.html" href="monitor.html">监管动态</a>
        <a class="nav-link" data-nav-page="qa.html" href="qa.html">法规问答</a>

      <div class="header-actions">
        <a class="icon-btn header-search" href="qa.html" aria-label="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

          </svg>
        </a>
        <button class="icon-btn nav-toggle" data-nav-toggle type="button" aria-label="菜单" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16" />

        </button>
      </div>
    </div>
  </header>

  <!-- Mobile nav -->
  <nav class="mobile-nav" data-mobile-nav aria-label="移动端导航">
    <a data-nav-page="index.html" href="index.html">首页</a>
    <a data-nav-page="monitor.html" href="monitor.html">监管动态</a>
    <a data-nav-page="qa.html" href="qa.html">法规问答</a>
    <a data-nav-page="scanner.html" href="scanner.html">风险扫描</a>
  </nav>

  <!-- Main -->
  <main class="main">
    <div class="container">
      <div class="page-head">
        <h1 class="page-title">业务风险扫描</h1>
        <p class="page-sub">Risk Scanner · 用自然语言描述业务场景，生成初步合规风险清单</p>
      </div>

      <!-- Scan form -->
      <form class="scan-form" data-scan-form>
        <div class="scan-box">
          <textarea
            name="scenario"
            placeholder="描述你的业务场景，例如：公司计划在日本上线 AI 陪伴 App，用户可以长期与 AI 对话，聊天记录会保存并用于模型优化……"
            aria-label="描述业务场景"
            data-scan-input
          ></textarea>
          <div class="scan-foot">
            <span class="scan-hint">描述越具体，风险识别越准确（法域 / 产品 / 数据 / 主体 / 处理活动）</span>
            <button class="btn btn-primary" type="submit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              </svg>
              开始合规扫描
            </button>
          </div>
        </div>
      </form>

      <!-- Suggested scenarios -->
      <div class="suggest" data-suggest>
        <button class="tag" type="button" data-scenario="公司计划在日本上线 AI 陪伴 App，用户可以长期与 AI 对话，聊天记录会保存并用于模型优化，同时使用第三方云服务，并允许未成年人使用。">日本 · AI 陪伴 App</button>
        <button class="tag" type="button" data-scenario="我们准备在日本通过 LINE + Shopify + Klaviyo 做私域营销，并使用第三方服务商进行系统集成。">日本 · LINE 私域营销</button>
      </div>

      <!-- Result -->
      <div data-result></div>
    </div>
  </main>

  <footer class="main" style="padding-top: 0; padding-bottom: var(--sp-8);">
    <div class="container">
      <div class="divider"></div>
      <p class="caption text-tertiary">
        风险扫描输出为 Preliminary Compliance Assessment（初步合规判断），不构成正式法律意见。
      </p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script>
    (function () {
      'use strict';

      var LOADING_STEPS = [
        '理解业务场景',
        '识别数据流与参与主体',
        '检索适用法规',
        '评估合规风险'
      ];

      /* ---- Demo scenarios ---- */
      var SCENARIOS = [
        {
          match: /ai|陪伴|对话|模型|未成年|聊天|app/i,
          overview: { total: 5, high: 2, medium: 2, low: 1 },
          identify: {
            jurisdiction: 'JP',
            product: 'AI 陪伴 App',
            data: ['账号数据', '聊天内容', '行为数据', '儿童数据（可能）'],
            activities: ['收集', '保存', '分析', '模型优化', '第三方委托处理'],
            parties: ['企业', '用户', '云服务商', 'AI 服务商']
          },
          risks: [
            {
              level: '高',
              title: 'AI 对话数据用于模型优化',
              summary: '需确认利用目的与模型优化用途之间的关系，核查隐私告知及利用目的',
              desc: '用户与 AI 的长期对话内容被保存并用于模型优化，构成对个人信息的进一步处理，需明确利用目的并取得相应依据。',
              basis: 'APPI 第 17 条（利用目的特定）',
              why: '若隐私告知未明确「模型优化」这一利用目的，则难以直接沿用原合法性基础，可能构成超出目的范围的处理。',
              action: '在隐私政策中明确列出「模型优化」用途，并核查是否需取得用户同意；如涉及敏感信息，需单独同意。'
            },
            {
              level: '高',
              title: '未成年人数据处理',
              summary: '面向未成年用户收集数据需取得监护人同意',
              desc: '产品允许未成年人使用，可能收集 16 岁以下未成年人的个人信息，触发监护人同意要求。',
              basis: 'APPI 第 20 条（16 岁以下监护人同意）',
              why: '未取得监护人同意即收集儿童个人信息，可能构成重大合规风险并面临执法。',
              action: '建立年龄验证与监护人同意机制，或限制未成年人使用核心功能，并单独评估儿童数据的处理。'
            },
            {
              level: '中',
              title: '第三方云服务 / AI 服务商委托处理',
              summary: '需签署委托合同并履行监督义务',
              desc: '使用第三方云服务与 AI 服务商处理数据，构成委托处理，需明确双方义务。',
              basis: 'APPI 第 25 条（委托）',
              why: '委托处理方数据泄露或滥用时，委托方仍须承担责任，需通过合同与监督转移风险。',
              action: '与服务商签署数据处理协议（DPA），明确处理范围、安全措施与再委托限制，并定期监督。'
            },
            {
              level: '中',
              title: '聊天记录长期保存',
              summary: '数据最小化与保存期限控制',
              desc: '聊天记录长期保存可能超出实现目的所必需的范围，违反数据最小化原则。',
              basis: 'APPI 第 19 条（不必要数据不处理）',
              why: '长期保留对话数据增加泄露与滥用风险，且与目的限定原则冲突。',
              action: '设定明确的保存期限与删除策略，对不再需要的数据及时删除或匿名化。'
            },
            {
              level: '低',
              title: '跨境传输（如服务商位于境外）',
              summary: '向境外第三方提供个人信息需满足法定条件',
              desc: '若云服务或 AI 服务商服务器位于境外，涉及个人信息的跨境提供。',
              basis: 'APPI 第 28 条（跨境提供）',
              why: '跨境提供需取得用户同意或满足等效性要求，否则可能不合规。',
              action: '核查服务商服务器位置；如需跨境，确保取得同意或满足标准合同等例外。'
            }
          ]
        },
        {
          match: /line|shopify|klaviyo|营销|私域|集成/i,
          overview: { total: 5, high: 2, medium: 2, low: 1 },
          identify: {
            jurisdiction: 'JP',
            product: '私域营销体系（LINE 官方账号）',
            data: ['用户联系方式', '订单数据', '行为数据', '营销偏好'],
            activities: ['收集', '第三方提供', '营销推送', '系统集成'],
            parties: ['企业', 'LINE', 'Shopify', 'Klaviyo', '系统集成商']
          },
          risks: [
            {
              level: '高',
              title: '向第三方提供个人信息',
              summary: '在 LINE / Shopify / Klaviyo 之间共享用户数据需取得同意',
              desc: '将用户数据在 LINE、Shopify、Klaviyo 及集成服务商之间流转，构成「向第三方提供」，需满足同意或例外条件。',
              basis: 'APPI 第 27 条（第三方提供）',
              why: '营销场景下多平台数据打通，是日本监管的重点，未经同意向第三方提供是最常见的执法风险。',
              action: '就第三方提供取得用户明确同意，或评估是否满足 opt-out 例外（敏感信息除外），并向 PPC 申报。'
            },
            {
              level: '高',
              title: '营销推送的 opt-out 要求',
              summary: '营销消息须提供便捷的退出机制',
              desc: '通过 LINE 等渠道进行营销推送，涉及对用户个人信息的营销利用与电子广告规范。',
              basis: 'APPI 第 27 条（opt-out）',
              why: '未提供有效 opt-out 或未按用户选择停止推送，可能违反同意规则并引发投诉。',
              action: '在每条营销消息中提供清晰的退订入口，并建立用户撤回同意的处理流程。'
            },
            {
              level: '中',
              title: '跨境传输（Klaviyo 美国服务器）',
              summary: '向境外传输用户数据需满足法定条件',
              desc: 'Klaviyo 等服务商服务器位于美国，涉及个人信息的跨境传输。',
              basis: 'APPI 第 28 条（跨境提供）',
              why: '跨境提供需取得用户同意或满足等效性要求，美国未被日本认定为同等保护水平。',
              action: '就跨境传输取得用户同意，或采用 PPC 认可的标准合同条款并评估接收国制度。'
            },
            {
              level: '中',
              title: '第三方委托处理合同与监督',
              summary: '系统集成商与营销服务商的委托关系',
              desc: '使用第三方服务商进行系统集成与营销自动化，构成委托处理，需合同约束与监督。',
              basis: 'APPI 第 25 条（委托）',
              why: '集成商或服务商的数据滥用、泄露责任最终可能追溯至企业。',
              action: '与各服务商签署 DPA，明确处理范围、安全措施与再委托限制，并定期审查。'
            },
            {
              level: '低',
              title: 'Cookie / 追踪技术透明度',
              summary: '营销跟踪与广告投放的告知要求',
              desc: '营销体系中 Cookie、SDK 与追踪技术用于广告与个性化推荐，需履行告知义务。',
              basis: '电信业务法相关规范',
              why: '追踪技术的透明度不足，可能引发用户信任与合规问题。',
              action: '在网站与 App 中披露 Cookie/SDK 使用情况，并提供必要的同意或退订机制。'
            }
          ]
        }
      ];

      var resultEl = document.querySelector('[data-result]');
      var form = document.querySelector('[data-scan-form]');
      var input = document.querySelector('[data-scan-input]');
      var suggestEl = document.querySelector('[data-suggest]');
      var currentTimer = null;

      var RISK_CLASS = { '高': 'risk-high', '中': 'risk-medium', '低': 'risk-low' };

      function findScenario(text) {
        for (var i = 0; i < SCENARIOS.length; i++) {
          if (SCENARIOS[i].match.test(text)) return SCENARIOS[i];
        }
        return null;
      }

      function renderEmpty() {
        resultEl.innerHTML = '' +
          '<div class="empty">' +
            '<svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />' +
            '</svg>' +
            '<h3>描述一个业务场景开始扫描</h3>' +
            '<p>输入你的业务场景，系统将自动识别法域、数据、主体与处理活动，并生成风险清单。</p>' +
            '<p class="try">试试：<span style="color:var(--navy);">“我们准备在日本上线一个 AI 陪伴 App……”</span></p>' +
          '</div>';
      }

      function renderLoading() {
        var steps = LOADING_STEPS.map(function (s, i) {
          var cls = i === 0 ? 'active' : '';
          var icon = i === 0
            ? '<span class="spinner step-icon"></span>'
            : '<svg class="step-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>';
          return '<div class="loading-step ' + cls + '">' + icon + '<span>' + s + '</span></div>';
        }).join('');

        resultEl.innerHTML = '' +
          '<div class="loading">' +
            '<div class="loading-title">正在评估合规风险……</div>' +
            '<div class="loading-steps">' + steps + '</div>' +
          '</div>';
      }

      function riskCard(r) {
        return '' +
          '<div class="risk-card">' +
            '<button class="risk-card-head" type="button" data-accordion>' +
              '<span class="risk ' + RISK_CLASS[r.level] + '">' + r.level + '</span>' +
              '<div class="rc-main">' +
                '<div class="rc-title">' + r.title + '</div>' +
                '<div class="rc-summary">' + r.summary + '</div>' +
              '</div>' +
              '<svg class="rc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
            '</button>' +
            '<div class="risk-card-body">' +
              '<div class="rc-detail">' +
                '<div class="rc-dlabel">风险说明</div>' +
                '<div class="rc-dtext">' + r.desc + '</div>' +
                '<div class="rc-dlabel">法律依据</div>' +
                '<div style="margin-bottom: var(--sp-3);"><span class="legal-basis">' + r.basis + '</span></div>' +
                '<div class="rc-dlabel">为什么重要</div>' +
                '<div class="rc-dtext">' + r.why + '</div>' +
                '<div class="rc-dlabel">建议措施</div>' +
                '<div class="rc-dtext">' + r.action + '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
      }

      function idTags(list) {
        return list.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('');
      }

      function renderResult(s) {
        var ov = s.overview;
        var id = s.identify;

        var html = '' +
          '<div class="result">' +

            /* Overview */
            '<div class="overview">' +
              '<div class="ov-item"><div class="ov-value">' + ov.total + '</div><div class="ov-label">潜在风险</div></div>' +
              '<div class="ov-item ov-high"><div class="ov-value">' + ov.high + '</div><div class="ov-label">高风险</div></div>' +
              '<div class="ov-item ov-medium"><div class="ov-value">' + ov.medium + '</div><div class="ov-label">中风险</div></div>' +
              '<div class="ov-item ov-low"><div class="ov-value">' + ov.low + '</div><div class="ov-label">低风险</div></div>' +
            '</div>' +

            /* Identification */
            '<div class="identify">' +
              '<div class="id-title">业务识别</div>' +
              '<div class="id-grid">' +
                '<div class="id-field"><div class="id-label">法域</div><div class="id-value"><span class="juris">' + id.jurisdiction + '</span></div></div>' +
                '<div class="id-field"><div class="id-label">产品 / 业务</div><div class="id-value">' + id.product + '</div></div>' +
                '<div class="id-field"><div class="id-label">数据类型</div><div class="id-tags">' + idTags(id.data) + '</div></div>' +
                '<div class="id-field"><div class="id-label">处理活动</div><div class="id-tags">' + idTags(id.activities) + '</div></div>' +
                '<div class="id-field" style="grid-column:1/-1;"><div class="id-label">参与主体</div><div class="id-tags">' + idTags(id.parties) + '</div></div>' +
              '</div>' +
            '</div>' +

            /* Risk list */
            '<div class="risk-list-title">风险清单 <span class="count">共 ' + ov.total + ' 项 · 点击展开详情</span></div>' +
            '<div class="risk-list">' +
              s.risks.map(riskCard).join('') +
            '</div>' +

            '<div class="answer-disclaimer" style="margin-top: var(--sp-5);">' +
              '本结果为 Preliminary Compliance Assessment（初步合规判断），基于描述的业务事实与可获得的公开法规生成，不构成正式法律意见。建议由专业法务进一步核验。' +
            '</div>' +
          '</div>';

        resultEl.innerHTML = html;

        /* Accordion */
        resultEl.querySelectorAll('[data-accordion]').forEach(function (head) {
          head.addEventListener('click', function () {
            head.closest('.risk-card').classList.toggle('is-open');
          });
        });
      }

      function submit(text) {
        text = (text || '').trim();
        if (!text) return;

        input.value = text;
        renderLoading();

        if (currentTimer) clearTimeout(currentTimer);
        currentTimer = setTimeout(function () {
          var s = findScenario(text);
          if (s) {
            renderResult(s);
          } else {
            renderEmpty();
          }
        }, 1400);
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        submit(input.value);
      });

      suggestEl.querySelectorAll('.tag').forEach(function (chip) {
        chip.addEventListener('click', function () {
          submit(chip.getAttribute('data-scenario'));
        });
      });

      /* Initial empty state */
      renderEmpty();
    })();
  </script>
</body>
</html>
